[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-a2a-agent"
version = "0.1.3"
description = "Framework-agnostic A2A agent with pluggable Providers & Frameworks (MCP, LangChain, LangGraph, CrewAI, BeeAI, AutoGen, watsonx.ai)"
readme = "README.md"
authors = [{ name = "Ruslan Magana Vsevolodovna", email = "contact@ruslanmv.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "structlog>=24.2"
]

[project.optional-dependencies]
# --- Framework adapters ---
langchain = [
  "langchain>=0.2",
  "langchain-community>=0.2"
]

# Native LangGraph extras (MessagesState + LC message types)
langgraph = [
  "langgraph>=0.2",
  "langchain-core>=0.2",
  "langchain>=0.2",
  "langchain-community>=0.2"
]

# CrewAI adapters/tools
crewai = [
  "crewai>=0.76.0",
  "crewai-tools>=0.31.0"
]

autogen = ["pyautogen>=0.2"]
beeai = ["beeai-framework[a2a]>=0.1.44"]

# --- RAG bundle for /knowledge endpoints (retriever + vector DBs + embeddings) ---
rag = [
  "crewai-tools>=0.31.0",   # RagTool
  "chromadb>=0.5.5",        # default in-process vector DB
  "qdrant-client>=1.9.0",   # optional external vector DB (A2A_VDB=qdrant)
  "openai>=1.0"             # simple embeddings provider (set OPENAI_API_KEY)
]

# --- Provider plugins ---
openai = ["openai>=1.0"]
watsonx = [
  "ibm-watsonx-ai>=1.1.15",
  "langchain-ibm>=0.1.12",
  "langchain>=0.2,<0.3"
]
anthropic = ["anthropic>=0.30"]
gemini = ["google-generativeai>=0.7"]
azure_openai = ["openai>=1.0"]
bedrock = ["boto3>=1.34", "botocore>=1.34"]
ollama = []

# Convenience bundles
providers-all = [
  "openai>=1.0",
  "ibm-watsonx-ai>=1.0",
  "anthropic>=0.30",
  "google-generativeai>=0.7",
  "boto3>=1.34",
  "botocore>=1.34"
]

frameworks-all = [
  "langgraph>=0.2",
  "langchain-core>=0.2",
  "langchain>=0.2",
  "langchain-community>=0.2",
  "crewai>=0.76.0",
  "crewai-tools>=0.31.0",
  "pyautogen>=0.2",
  "beeai-framework[a2a]>=0.1.44"
]

all = [
  # frameworks
  "langgraph>=0.2",
  "langchain-core>=0.2",
  "langchain>=0.2",
  "langchain-community>=0.2",
  "crewai>=0.76.0",
  "crewai-tools>=0.31.0",
  "pyautogen>=0.2",
  "beeai-framework[a2a]>=0.1.44",
  # providers
  "openai>=1.0",
  "ibm-watsonx-ai>=1.0",
  "anthropic>=0.30",
  "google-generativeai>=0.7",
  "boto3>=1.34",
  "botocore>=1.34",
  # vector DBs (RAG)
  "chromadb>=0.5.5",
  "qdrant-client>=1.9.0"
]

# --- Developer & test extras ---
test = [
  "pytest>=8.2",
  "pytest-cov>=5.0"
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.8",
  "mypy>=1.11",
  "types-requests>=2.31.0.10"
]

[project.scripts]
a2a = "a2a_universal.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------
# Pytest & Coverage defaults
# ---------------------------
[tool.pytest.ini_options]
# Removed coverage flags from addopts to avoid errors when pytest-cov isn't installed.
addopts = "-q --maxfail=1 --disable-warnings"
testpaths = ["tests"]

[tool.coverage.run]
source = ["a2a_universal"]
branch = true
relative_files = true

[tool.coverage.report]
omit = ["tests/*"]
skip_empty = true
fail_under = 0
