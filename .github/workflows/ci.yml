name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test deps (ensure server extras)
        run: |
          python -m pip install --upgrade pip
          # Try to install with the server extras; fall back to plain editable install
          pip install -e .[server] || pip install -e .
          # Make sure runtime deps used by the server are present in CI
          pip install -U httpx uvicorn fastapi structlog pytest pytest-cov

      - name: Show environment
        run: |
          python --version
          pip --version
          pip list

      - name: Run tests
        run: |
          pytest -q --maxfail=1 --disable-warnings \
            --cov=a2a_universal --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml